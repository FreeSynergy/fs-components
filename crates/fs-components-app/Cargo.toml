[package]
name = "fs-components-app"
description = "FreeSynergy application shell (layer 4): window, navigation between screens, title bar and status line around workbenches; Blinc stays behind this API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The window starts the writer of `FS_TEST_ACCESS_FILE` (see `fs-components-primitives`). Never in a release.
test-access = ["fs-components-widgets/test-access"]

[dependencies]
fs-components-mf2 = { path = "../fs-components-mf2" }
fs-components-render = { path = "../fs-components-render" }
fs-components-widgets = { path = "../fs-components-widgets" }
fs-components-words = { path = "../fs-components-words" }
blinc_app.workspace = true
blinc_cn.workspace = true
blinc_core.workspace = true
blinc_layout.workspace = true
blinc_theme.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
