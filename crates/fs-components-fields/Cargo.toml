[package]
name = "fs-components-fields"
description = "FreeSynergy components per basic type (input, display, compact, cell) in the styles of fs-components-styles; Blinc stays behind this API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blinc_core = "0.6"
blinc_layout = "0.6"
fs-components-styles = { path = "../fs-components-styles" }
fs-components-widgets = { path = "../fs-components-widgets" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.1", features = ["values"] }

[dev-dependencies]
blinc_theme = "0.6"
blinc_cn = "0.6"
blinc_app = "0.6"
wgpu = "26"
blinc_animation = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
