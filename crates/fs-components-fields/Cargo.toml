[package]
name = "fs-components-fields"
description = "FreeSynergy components per basic type (input, display, compact, cell) in the styles of fs-components-styles; Blinc stays behind this API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blinc_core.workspace = true
blinc_layout.workspace = true
fs-components-styles = { path = "../fs-components-styles" }
fs-components-widgets = { path = "../fs-components-widgets" }
fs-components-primitives = { path = "../fs-components-primitives" }
fs-interfaces = { workspace = true, features = ["values"] }

[dev-dependencies]
blinc_theme.workspace = true
blinc_cn.workspace = true
blinc_app.workspace = true
wgpu = "26"
blinc_animation.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
