[package]
name = "fs-components-map"
description = "FreeSynergy component Karte (ADR 0066): the map view (Web-Mercator tiles, vector tiles decoded from MVT, markers, pan and zoom) and its surface for the window shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blinc_core = "0.6"
blinc_layout = "0.6"
blinc_theme = "0.6"
fs-components-widgets = { path = "../fs-components-widgets" }
fs-components-app = { path = "../fs-components-app" }
mvt-reader = "2"
geo-types = "0.7"

[dev-dependencies]
blinc_app = "0.6"
blinc_cn = "0.6"
mvt = "0.15"
wgpu = "26"
image = { version = "0.25", default-features = false, features = ["png"] }
