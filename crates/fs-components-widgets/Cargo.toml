[package]
name = "fs-components-widgets"
description = "FreeSynergy widgets (layer 2): text-view over a neutral block model, tree-view; Blinc stays behind this API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blinc_core.workspace = true
blinc_layout.workspace = true
blinc_cn.workspace = true
blinc_theme.workspace = true
blinc_noto_emoji.workspace = true
fontdb = "0.22"
ttf-parser = "0.24"
fs-components-primitives = { path = "../fs-components-primitives" }
fs-components-styles = { path = "../fs-components-styles" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
blinc_app.workspace = true
wgpu = "26"
blinc_animation.workspace = true
