[package]
name = "fs-components-widgets"
description = "FreeSynergy widgets (layer 2): text-view over a neutral block model, tree-view; Blinc stays behind this API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blinc_core = "0.6"
blinc_layout = "0.6"
blinc_cn = "0.6"
blinc_theme = "0.6"
blinc_noto_emoji = "0.6"
fontdb = "0.22"
ttf-parser = "0.24"
fs-components-primitives = { path = "../fs-components-primitives" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
blinc_app = "0.6"
wgpu = "26"
blinc_animation = "0.6"
