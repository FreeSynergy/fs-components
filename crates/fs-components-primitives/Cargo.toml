[package]
name = "fs-components-primitives"
description = "FreeSynergy primitives (layer 1): search-field; Blinc stays behind this API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# A read-only way for a test to ask what is typed into the text fields (see `src/test_access.rs`). Never in a release.
test-access = []

[dependencies]
blinc_core.workspace = true
blinc_layout.workspace = true
blinc_cn.workspace = true
blinc_theme.workspace = true
fs-interfaces = { workspace = true, features = ["values"] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the file of the feature `test-access`.
libc = "0.2"
