[package]
name = "fs-components-workbenches"
description = "FreeSynergy workbenches (layer 3): the document reader, open work surface over a data source it knows nothing about; Blinc stays behind this API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-components-widgets = { path = "../fs-components-widgets" }
fs-components-primitives = { path = "../fs-components-primitives" }
blinc_app.workspace = true
blinc_cn.workspace = true
blinc_core.workspace = true
blinc_layout.workspace = true
blinc_theme.workspace = true
fs-components-render = { path = "../fs-components-render" }
fs-components-editor = { path = "../fs-components-editor" }
fs-components-mf2 = { path = "../fs-components-mf2" }
fs-components-words = { path = "../fs-components-words" }

[dev-dependencies]
# Only for the size of the smallest window: the app crate knows no workbench.
fs-components-app = { path = "../fs-components-app" }
# WCAG contrast of the colours in the pictures.
fs-components-styles = { path = "../fs-components-styles" }
wgpu = "26"
image = { version = "0.25", default-features = false, features = ["png"] }
