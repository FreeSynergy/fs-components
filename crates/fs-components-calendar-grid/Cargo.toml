[package]
name = "fs-components-calendar-grid"
description = "FreeSynergy calendar grid component: month grid, week grid, day column with time axis, all-day row, multi-day spans; plain data in, Blinc stays behind this API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blinc_core.workspace = true
blinc_layout.workspace = true
blinc_cn.workspace = true
fs-components-styles = { path = "../fs-components-styles" }
fs-components-fields = { path = "../fs-components-fields" }
fs-components-widgets = { path = "../fs-components-widgets" }

[dev-dependencies]
blinc_theme.workspace = true
blinc_app.workspace = true
wgpu = "26"
blinc_animation.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
