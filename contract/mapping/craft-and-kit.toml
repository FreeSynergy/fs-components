# Mapping of the Craft style sheet, the Blinc kit (cn-*), the window shell and the admin frontend to the contract.
# The craft-* classes are the style sheet of one look: the contract names replace them (status remove).

[map.mapped]
"cn-input" = "textbox.input"
"cn-menu" = "menu.root"
"cn-menu-item" = "menu.item"
"cn-menubar-content" = "menubar.panel"
"cn-menubar-item" = "menubar.item"
"cn-menubar-trigger" = "menubar.trigger"
"cn-textarea" = "textbox/multiline"
"fs-admin-field" = "form-field.root"
"fs-admin-head" = "grid.head"
"fs-admin-header" = "detail-page.head"
"fs-admin-message" = "alert/info"
"fs-admin-page" = "detail-page.root"
"fs-admin-panel" = "card/panel"
"fs-app-bar" = "app-window.bar"
"fs-app-empty" = "app-window.empty"
"fs-app-main" = "app-window.main"
"fs-app-menu-panel" = "menubar.panel"
"fs-app-menus" = "menubar.root"
"fs-app-nav" = "app-window.nav"
"fs-app-root" = "app-window.root"
"fs-app-row" = "app-window.row"
"fs-app-status" = "status.root"
"fs-app-status-line" = "status.line"
"fs-app-status-more" = "status.more"
"fs-app-status-panel" = "status.panel"
"fs-app-status-problem" = "status.problem"
"fs-app-status-text" = "status.text"
"fs-app-title" = "app-window.title"
"fs-app-title-box" = "app-window.title-box"
"list-stale" = "alert/warning"
"not-loaded" = "alert/info"
"page-actions" = "detail-page.actions"
"page-title" = "detail-page.title"
"running" = "status:busy"

[map.remove]
"craft-badge" = "badge.root"
"craft-bar" = "toolbar.root"
"craft-box" = "card.root"
"craft-btn" = "button"
"craft-btn-fill" = "button/fill"
"craft-btn-fill-text" = "button.label"
"craft-btn-line" = "button/line"
"craft-btn-off" = "button:disabled"
"craft-caps" = "text/caps"
"craft-caps-dim" = "text/caps-dim"
"craft-cell" = "toolbar.cell"
"craft-field" = "textbox.input"
"craft-footer" = "status.root"
"craft-grid" = "tile-grid.root"
"craft-link" = "link.label"
"craft-mono" = "text/mono"
"craft-mono-text" = "text/mono"
"craft-nav" = "sidebar.root"
"craft-nav-item" = "sidebar.item"
"craft-nav-off" = "sidebar.item:disabled"
"craft-note" = "note.root"
"craft-number" = "tile-grid.number"
"craft-number-text" = "tile-grid.number"
"craft-panel" = "card/panel"
"craft-pill" = "tag:selected"
"craft-pill-off" = "tag"
"craft-pill-text" = "tag.label"
"craft-progress-track" = "progressbar.track"
"craft-section" = "section.root"
"craft-sub" = "text/sub"
"craft-t-bad" = "text/error"
"craft-t-info" = "text/info"
"craft-t-ok" = "text/ok"
"craft-t-quiet" = "text/quiet"
"craft-t-warn" = "text/warning"
"craft-tab" = "tab.root"
"craft-tab-on" = "tab:selected"
"craft-thead" = "table.head"
"craft-tile" = "tile-grid.tile"
"craft-tile-body" = "tile-grid.body"
"craft-tile-head" = "tile-grid.head"
"craft-trow" = "table.row"
