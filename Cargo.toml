[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.20"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

# Blinc: the one place. Every blinc_* crate comes from the same tag of our fork, so a program that depends on
# fs-components gets it transitively (Cargo applies [patch] only at the top of a build, so none is used here).
[workspace.dependencies]
blinc_animation = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.1" }
blinc_app = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.1" }
blinc_cn = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.1" }
blinc_core = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.1" }
blinc_layout = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.1" }
blinc_noto_emoji = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.1" }
blinc_theme = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.1" }

# fs-interfaces: one tag for every crate (the two packages come from the same repository, so one source in the tree).
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19" }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19" }
