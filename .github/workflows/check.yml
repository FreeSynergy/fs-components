# Copy to <repo>/.github/workflows/check.yml - runs fmt, clippy (pedantic), tests and the coding rules on every push.
name: check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: FreeSynergy/fs-release/.github/workflows/check.yml@main
    with:
      # Software Vulkan (lavapipe) for the tests that open a graphics adapter.
      apt-packages: "mesa-vulkan-drivers libvulkan1"
